# The models that can play a seat, verified with `scripts/check_models.py`. Prices are USD
# per million tokens, used only for cost estimates. Check them against the Vertex AI
# pricing page when adding or updating a model.
#
# Gemini Pro and Flash cannot switch thinking off (`off` maps to the minimal thinking
# level, which only Flash-Lite accepts), so they think at `low`. LiteLLM implements
# structured output for Claude with a forced tool choice, which Claude Sonnet rejects, so
# it gets the JSON schema in the prompt instead.
- id: gemini-pro
  display_name: Gemini Pro
  provider: google
  adk_model: gemini-3.1-pro-preview
  via: native
  location: global
  logo: logos/gemini.svg
  supports_structured_output: true
  thinking: low
  temperature: 1.0
  price_per_mtok: {input: 2.0, output: 12.0}

- id: gemini-flash
  display_name: Gemini Flash
  provider: google
  adk_model: gemini-3.8-flash
  via: native
  location: global
  logo: logos/gemini.svg
  supports_structured_output: true
  thinking: low
  temperature: 1.0
  price_per_mtok: {input: 0.75, output: 3.75}

