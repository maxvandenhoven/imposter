[project]
name = "imposter"
version = "0.1.0"
description = "LLM agents from different model families play the social deduction game Imposter."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "google-genai>=2.34.0",
    "litellm>=1.106.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
imposter = "imposter.cli:app"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.9",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 90
indent-width = 4
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "EM",  # flake8-errmsg
    "T20",  # flake8-print
    "RET",  # flake8-return
    "ANN",  # flake8-annotations
    "UP",  # pyupgrade
]
ignore = [
    "D100",  # Ignore missing docstring in public module
    "D104",  # Ignore missing docstring in public package
    "ANN002",  # Ignore missing *args type annotations
    "ANN003",  # Ignore missing **kwargs type annotations
    "ANN401",  # Ignore Any type annotations
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100",  # Ignore missing docstring in public module
    "D101",  # Ignore missing docstring in public class
    "D102",  # Ignore missing docstring in public method
    "D103",  # Ignore missing docstring in public function
    "D104",  # Ignore missing docstring in public package
    "D107",  # Ignore missing docstring in __init__ method
]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["scripts", "scripts/tooling"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "scripts/tooling"]
addopts = ["--strict-markers"]
markers = ["slow: long-running tests, excluded from `make test` (run with `make test-slow`)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/imposter"]
core = "sysmon"
concurrency = ["thread"]
